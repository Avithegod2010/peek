name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PEEK_KEYSTORE: ${{ github.workspace }}/release-signing.jks
      PEEK_KEYSTORE_PASSWORD: ${{ secrets.PEEK_KEYSTORE_PASSWORD }}
      PEEK_KEY_ALIAS: ${{ secrets.PEEK_KEY_ALIAS }}
      PEEK_KEY_PASSWORD: ${{ secrets.PEEK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check required release secrets
        env:
          PEEK_KEYSTORE_BASE64: ${{ secrets.PEEK_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for name in PEEK_KEYSTORE_BASE64 PEEK_KEYSTORE_PASSWORD PEEK_KEY_ALIAS PEEK_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode the signing keystore
        env:
          PEEK_KEYSTORE_BASE64: ${{ secrets.PEEK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PEEK_KEYSTORE_BASE64" | base64 --decode > "$PEEK_KEYSTORE"
          chmod 600 "$PEEK_KEYSTORE"

      - name: Check that the tag matches versionName
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$VERSION\"" app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Build signed release
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature, package and debuggable state
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          if "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable; refusing to publish."
            exit 1
          fi
          mkdir -p release
          cp "$APK" "release/peek-${VERSION}-release.apk"
          (cd release && sha256sum "peek-${VERSION}-release.apk" > SHA256SUMS.txt)

      - name: Prepare release notes
        run: |
          mkdir -p release
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" release/RELEASE_NOTES.md
            echo "DRAFT=false" >> "$GITHUB_ENV"
          else
            bash scripts/generate-release-notes.sh "$GITHUB_REF_NAME" > release/RELEASE_NOTES.md
            echo "DRAFT=true" >> "$GITHUB_ENV"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            release/peek-*-release.apk
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$DRAFT" = "true" ]; then
            echo "No hand-written notes at docs/releases/${GITHUB_REF_NAME}.md; creating a draft for review."
            gh release create "$GITHUB_REF_NAME" \
              release/peek-"$VERSION"-release.apk \
              release/SHA256SUMS.txt \
              --title "Peek ${VERSION}" \
              --notes-file release/RELEASE_NOTES.md \
              --draft
          else
            gh release create "$GITHUB_REF_NAME" \
              release/peek-"$VERSION"-release.apk \
              release/SHA256SUMS.txt \
              --title "Peek ${VERSION}" \
              --notes-file release/RELEASE_NOTES.md \
              --latest
          fi

      - name: Remove the temporary keystore
        if: always()
        run: rm -f "$PEEK_KEYSTORE"
