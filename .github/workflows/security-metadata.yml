name: Dependency metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate Gradle verification metadata
        run: |
          chmod +x gradlew
          ./gradlew \
            --write-verification-metadata sha256 \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            --no-daemon --stacktrace

      - name: Generate a dependency inventory
        run: |
          mkdir -p build/security
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
            > build/security/release-dependencies.txt

      - name: Upload verification files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-metadata
          path: |
            gradle/verification-metadata.xml
            build/security/release-dependencies.txt
          if-no-files-found: error

  verify-release:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify the release configuration against checksums
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
