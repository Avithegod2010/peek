name: Record screenshot baselines

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Record goldens on Linux
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests com.avi.peek.ScreenshotBaselineTest -Proborazzi.test.record=true --no-daemon --stacktrace
      - name: Upload screenshot baselines
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: app/src/test/screenshots/*.png
          if-no-files-found: error
